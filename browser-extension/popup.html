<!DOCTYPE html>
<html>
  <head>
    <style>
      :root {
        --primary-color: #6366f1;
        --bg-color: #f8fafc;
        --text-color: #1e293b;
      }

      body {
        width: 320px;
        padding: 20px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
      }

      h3 {
        margin-top: 0;
        font-size: 18px;
        color: var(--primary-color);
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      #result {
        margin-top: 15px;
        padding: 10px;
        background: white;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
        font-size: 13px;
        min-height: 40px;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body>
  <h3>LockBox Secure Vault</h3>
  <input type="text" id="site" placeholder="Site URL or Name...">
    <button id="get">Fetch Entry</button>
  <div id="result">Waiting for input...</div>
    <script src="popup.js"></script>
  </body>
</html>
